<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In Page</title>
  <link rel="stylesheet" href="std-signin.css">
</head>
<body>
  <div class="signin-container">
    <h2>Student Sign In</h2>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="hallticket">Hall Ticket Number</label>
      <input type="text" id="hallticket" name="hallticket" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="password">Confirm Password</label>
      <input type="Confirmpassword" id="Confirmpassword" name="Confirmpassword" required>

      <button type="submit"><a href="std-login.html">Sign In</a></button>

    </form>
    <p class="login-link">
        Already have an account? <a href="std-login.html">Login here</a>
    </p>
  </div>
</body>
</html>
