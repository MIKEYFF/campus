<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STD-Login</title>
  <link rel="stylesheet" href="std-login.css">
</head>
<body>
  <div class="login-container">
    <h2>Student Login</h2>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
        
      <label for="hallticket">Hall Ticket Number</label>
      <input type="text" id="hallticket" name="hallticket" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit"><a href="file:///C:/html/home.html">Login</a></button>
    </form>
    <p class="signin-link">
      Don't have an account? <a href="std-signin.html">Sign up here</a>
    </p>
  </div>
</body>
</html>
